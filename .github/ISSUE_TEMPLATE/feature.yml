name: Feature request
description: Something Pith could do.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you're trying to do
      description: The situation and the kinds of networks involved, in general terms, without addresses or names.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Optional.
