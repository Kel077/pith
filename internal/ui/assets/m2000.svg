<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="704" viewBox="0 0 1440 704" version="1.1" role="img" aria-labelledby="title desc">
  <title id="title">A mobile hotspot, front view</title>
